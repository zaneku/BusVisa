[build]
  publish = "public"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"
  included_files = ["private/**", "public/login.html"]

[[redirects]]
  from = "/api/invite/*"
  to = "/.netlify/functions/gateway"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/.netlify/functions/gateway"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    Cache-Control = "no-store"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "same-origin"
