<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="BusVisa" />
  <meta name="theme-color" content="#f5f8fc" />
  <meta name="busvisa-build" content="v0.3.2-busvisa-beta" />
  
  
  <link rel="canonical" href="https://busvisa.netlify.app/" />
  <meta name="description" content="护照和签证，点亮你的旅行地图。支持世界地图、旅行证件、各国入境方式。" />
  <link rel="icon" type="image/png" sizes="32x32" href="./icons/favicon-32.png?v=028" />
  <link rel="icon" type="image/x-icon" href="./favicon.ico?v=028" />
  <link rel="apple-touch-icon" sizes="180x180" href="./icons/apple-touch-icon.png?v=028" />
  <link rel="manifest" href="./manifest.webmanifest?v=028" />
  <link rel="stylesheet" href="./style.css?v=032" />
  <title>BusVisa · 签证地图</title>
</head><body>  <section id="beta-gate" class="beta-gate" aria-labelledby="beta-title">
    <div class="beta-gate__top">
      <span class="beta-gate__label" id="beta-label">PRIVATE BETA</span>
      <label class="beta-gate__lang">
        <span class="sr-only" id="beta-lang-label">选择语言</span>
        <select id="beta-language" aria-labelledby="beta-lang-label">
          <option value="zh-CN">简体中文</option>
          <option value="zh-HK">繁體中文（香港）</option>
          <option value="zh-TW">繁體中文（台灣）</option>
          <option value="en">English</option>
        </select>
      </label>
    </div>
    <div class="beta-gate__content">
      <div class="beta-gate__brand"><img src="./icons/icon-192.png" alt="" width="90" height="90" /><span>BusVisa</span></div>
      <div class="beta-gate__access"><span class="beta-gate__chip" id="beta-chip">邀请制内测</span><h1 id="beta-title">输入邀请码，开启旅行地图</h1><p id="beta-desc">BusVisa 目前仅向受邀用户开放。请输入邀请码以进入地图和签证功能。</p></div>
      <form id="beta-form" class="beta-form" autocomplete="off">
        <label for="beta-code" id="beta-input-label">邀请码</label>
        <div class="beta-form__field">
          <input id="beta-code" type="password" name="invitation" autocapitalize="off" autocorrect="off" spellcheck="false" autocomplete="off" inputmode="text" required maxlength="80" placeholder="请输入邀请码" aria-describedby="beta-hint beta-error" />
          <button id="beta-show" type="button" class="beta-form__eye" aria-label="显示邀请码">显示</button>
        </div>
        <p id="beta-error" class="beta-form__error" role="status" aria-live="polite"></p>
        <button id="beta-submit" type="submit" class="beta-form__submit">验证并进入 <span aria-hidden="true">→</span></button>
      </form>
      <div class="beta-gate__help"><span class="beta-gate__help-icon">✦</span><span id="beta-hint">验证成功后，本机将记住你的内测资格；无需每次重复输入。</span></div>
    </div>
    <footer class="beta-gate__footer"><span>BusVisa · v0.3.2 BETA</span><span id="beta-footer-text">仅供受邀用户测试 · Ku</span></footer>
  </section><script defer src="/beta-gate.js"></script></body></html>
